name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_RUSTFLAGS: '-C strip=symbols'

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: linux
      GOARCH: ${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libpcsclite-dev pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            libaribb25-rs/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-v3-${{ hashFiles('Cargo.lock', 'dvb-rs/Cargo.toml', 'libaribb24-rs/Cargo.toml', 'libaribb25-rs/Cargo.toml', 'libaribb25-rs/aribb25/Cargo.toml', 'libaribb25-rs/b25/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-v3-

      - name: Build dvb-rs (root workspace)
        run: cargo build --release

      - name: Build b25-rs (inner workspace)
        run: cargo build --release --manifest-path libaribb25-rs/Cargo.toml

      # Named isdbd, which is what the unit's ExecStart, scripts/install.sh
      # and the Makefile all call it. This step used to write `ferrite`
      # while shipping a unit that ran `isdbd`, so the tarball could not
      # start what it contained.
      - name: Build isdbd (Go daemon) and ferrite-tui
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o isdbd \
            ./cmd/isdbd
          go build \
            -ldflags "-s -w" \
            -o ferrite-tui \
            ./cmd/ferrite-tui

      - name: Assemble release directory
        run: |
          TAG='${{ github.ref_name }}'
          RELEASE_DIR="ferrite-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "$RELEASE_DIR"

          cp target/release/dvb-rs                 "$RELEASE_DIR/dvb-rs"
          cp target/release/arib-caption            "$RELEASE_DIR/arib-caption"
          cp libaribb25-rs/target/release/b25-rs    "$RELEASE_DIR/b25-rs"
          cp isdbd                                  "$RELEASE_DIR/isdbd"
          cp ferrite-tui                            "$RELEASE_DIR/ferrite-tui"

          # The installer, and both unit files it can install.
          mkdir -p "$RELEASE_DIR/scripts"
          cp scripts/install.sh                     "$RELEASE_DIR/scripts/"
          cp scripts/ferrite.service                "$RELEASE_DIR/scripts/"
          cp scripts/isdbd.service                  "$RELEASE_DIR/scripts/"

          # ONLY the example. `cp -r configs` shipped configs/isdbd.toml —
          # the author's own box: its adapter, its VAAPI render node, its
          # storage paths — into a public tarball, where it would either
          # confuse whoever unpacked it or, worse, be the file they started
          # from.
          mkdir -p "$RELEASE_DIR/configs"
          cp configs/isdbd.example.toml             "$RELEASE_DIR/configs/"
          cp README.md                              "$RELEASE_DIR/"

          chmod +x "$RELEASE_DIR/dvb-rs" "$RELEASE_DIR/arib-caption" \
                   "$RELEASE_DIR/b25-rs" "$RELEASE_DIR/isdbd" \
                   "$RELEASE_DIR/ferrite-tui" "$RELEASE_DIR/scripts/install.sh"

          # Refuse to ship a tarball that names a config nobody can use:
          # the example pointing back into a build tree is exactly how a
          # release goes out broken, and it went out that way once.
          #
          # Settings only — comments are stripped first. The file *documents*
          # the path this guard exists to catch, so checking the whole file
          # fails on the explanation of the bug rather than on the bug, which
          # is what it did the first time it ran.
          if sed 's/#.*//' "$RELEASE_DIR/configs/isdbd.example.toml" \
               | grep -qE '(target/release|/home/)'; then
            echo "ERROR: the example config still names a build tree or a home directory" >&2
            sed 's/#.*//' "$RELEASE_DIR/configs/isdbd.example.toml" \
              | grep -nE '(target/release|/home/)' >&2
            exit 1
          fi

          {
            echo "ferrite ${TAG} — linux/${{ matrix.arch }}"
            "$RELEASE_DIR/isdbd" --version 2>&1 | head -1
            "$RELEASE_DIR/dvb-rs" --version 2>&1 | head -1
          } > "$RELEASE_DIR/VERSION"
          cat "$RELEASE_DIR/VERSION"

      - name: Package
        run: |
          TAG='${{ github.ref_name }}'
          RELEASE_DIR="ferrite-${TAG}-linux-${{ matrix.arch }}"
          tar czf "${RELEASE_DIR}.tar.gz" "$RELEASE_DIR"
          sha256sum "${RELEASE_DIR}.tar.gz" > "${RELEASE_DIR}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: |
            ferrite-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
            ferrite-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ferrite-${{ github.ref_name }}-linux-*
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## ferrite ${{ github.ref_name }}

            **ISDB-T self-hosted TV stack** — tuner (dvb-rs) + descrambler (b25-rs) + orchestrator + web UI (ferrite).

            ### per-arch tarballs
            Each contains `isdbd` (the daemon), `ferrite-tui` (the remote
            control), the three programs the daemon spawns — `dvb-rs`,
            `b25-rs`, `arib-caption` — an example config, both systemd units
            and `scripts/install.sh`.

            | File | Arch |
            |------|------|
            | `ferrite-${{ github.ref_name }}-linux-amd64.tar.gz` | x86_64 |
            | `ferrite-${{ github.ref_name }}-linux-arm64.tar.gz` | aarch64 (Raspberry Pi 4/5, etc.) |

            ### install
            ```bash
            curl -L "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ferrite-${{ github.ref_name }}-linux-amd64.tar.gz" | tar xz
            cd ferrite-${{ github.ref_name }}-linux-amd64
            ./scripts/install.sh          # a systemd *user* service; --system for the other shape
            ```

            Installs into `~/.local/lib/ferrite` (the programs),
            `~/.config/ferrite` (your `isdbd.toml` and `channels.json`) and
            `~/.local/share/ferrite` (database and recordings). Your config
            and your recordings are never overwritten by an upgrade — run
            the same command again to upgrade.

            A user unit is deliberate: the DVB adapter and the B-CAS reader
            are reached through the invoking user's permissions, and pcscd's
            polkit rule is per-user.

            Edit `~/.config/ferrite/isdbd.toml` before the first start — at
            minimum the adapter and, if your box has a hardware encoder, the
            `[transcode]` and `[live]` argument lists. The daemon checks
            every program it spawns at startup and reports what it cannot
            find both in the log and on `/api/status`.

            ### requirements
            - Linux DVB adapter at `/dev/dvb/adapter*/`
            - `ffmpeg` / `ffprobe` on `$PATH`
            - For scrambled channels: `pcscd` + B-CAS card reader
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
