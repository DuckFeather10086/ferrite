# Default dev config for running isdbd from the workspace.
# For production, copy to /etc/isdbd/isdbd.toml and adjust paths.

http_port = 8010
storage_root = "./var"
# One Siano USB stick, terrestrial only. The `[[adapter]]` form names each
# frontend's delivery systems and is what a mixed card wants — see
# isdbd.example.toml; this list is read as ["ISDBT"].
adapters = [0]

# Sibling repos under ~/code/isdb-workspace/. Adjust if you cloned
# elsewhere.
# The binary is named after its crate, which dvb-rs renamed `dvbr` → `dvb-rs`
# when the repo was renamed. The config *key* keeps its old name so an
# existing isdbd.toml still parses.
dvbr_bin    = "./target/release/dvb-rs"
b25_bin     = "./libaribb25-rs/target/release/b25-rs"
ffmpeg_bin  = "ffmpeg"
ffprobe_bin = "ffprobe"
# ARIB caption decoder: live HLS gets a WebVTT subtitle rendition when this
# and ffprobe_bin are both set. Empty disables captions.
arib_caption_bin = "./target/release/arib-caption"

channels_file = "channels.json"

# Live segments on the tmpfs the unit creates (RuntimeDirectory=ferrite in
# scripts/ferrite.service, which also exports this variable). Keeps ~65 GB a
# day of rolling segment writes off the SSD the recordings are on. Run by
# hand outside systemd the variable is unset and this falls back to
# storage_root/hls.
hls_root = "$RUNTIME_DIRECTORY/hls"

# Live A/V sync: before starting ffmpeg, probe the first audio + video
# PTS and delay audio by their difference (ISDB interleaves audio ahead
# of the first decodable frame). Auto-enabled when ffprobe_bin is set.
#   probe_seconds     = 5   # sampling window; set < 0 to disable probing
#   audio_offset_bias = 0   # extra seconds added to the measured offset

# EPG refresh cron (UTC). Default: every 6 hours.
epg_cron = "0 */6 * * *"
# One entry per *mux*, not per channel. A pass harvests the EIT of the whole
# transport stream it tuned, so listing a second service on the same
# frequency only re-collects the same guide (the refresher skips it).
# Ten muxes × up to 60s of collection, at background priority — live viewing
# and recordings preempt it.
epg_channels = [
  "J：COMテレビ",     # 473.14 MHz
  "テレ玉1",          # 485.14
  "tvk1",             # 503.14
  "J：COMチャンネル", # 509.14
  "TOKYO MX1",        # 515.14
  "FUJI",             # 521.14
  "TBS1",             # 527.14
  "テレ東",           # 533.14
  "asahi",            # 539.14
  "NTV",              # 545.14
  "NHKEテレ1東京",    # 551.14
  "NHK_G",            # 557.14
]

# Live picture quality: two tiers, on demand. A viewer picks one and the
# daemon runs one encode for it — nothing is encoded until somebody asks,
# and both tiers of a channel come off the same tune and the same lease.
#
# Software x264 on purpose, unlike the recording post-pass below: live
# wants zerolatency and the iGPU is busy with the post-pass often enough
# that the CPU is the more predictable answer here (measured ~2.6×
# realtime on this N100).
[live]
# Decode on the iGPU as well as encode there, so a frame never crosses back
# into system memory. Same three arguments the post-pass transcode uses, and
# they have to be here rather than in a tier because ffmpeg wants them before
# -i; internal/hls inserts this list there (cfg.Live.InputArgs).
input_args = ["-hwaccel", "vaapi",
              "-hwaccel_device", "/dev/dri/renderD128",
              "-hwaccel_output_format", "vaapi"]

# Both tiers encode on the iGPU. libx264 was measured pegged at 99.8% of one
# core for a single 720p live encode on this box — 1.0x realtime with no
# headroom at all, on a machine with three other cores idle, because
# -tune zerolatency trades frame threading for latency and sliced threads do
# not scale. Sitting at exactly realtime is what made everything else jitter:
# any perturbation — a subprocess spawn, a GC pause, a second viewer — pushed
# the encoder behind, keyframes moved, and segments came out at 0.37s or 1.74s
# against an advertised 1.001s. VAAPI measured 7.0x realtime at ~10% of a core
# for 720p and 4.9x at ~14% for 1080p, with 1 segment in 239 off-nominal.
#
# On hardware without VAAPI, delete input_args and give each tier the software
# arguments back (yadif + scale + libx264); internal/hls's DefaultOutputArgs is
# exactly that and is what a daemon with no tier config uses. An ARM board wants
# its own encoder in the same shape — h264_v4l2m2m on a Pi 4, h264_rkmpp on
# Rockchip. Not a Pi 5: it has no hardware H.264 encoder at all, so that one is
# back to software.
[live.quality.1080p]
order       = 1
label       = "1080p"
bandwidth   = 6500000
# ISDB-T codes HD as 1440x1080 with non-square pixels (SAR 4:3), so the width is
# scaled by the source's own SAR rather than pinned to 1920 — see the transcode
# block below, which explains why at length. Measured out at 1920x1080 SAR 1:1.
output_args = ["-vf", "deinterlace_vaapi,scale_vaapi=w=trunc(iw*sar/2)*2:h=ih,setsar=1",
               "-c:v", "h264_vaapi",
               "-b:v", "6M", "-maxrate", "7M", "-bufsize", "12M",
               "-c:a", "aac", "-b:a", "192k"]

# Half the bitrate and a third of the pixels — for a phone on the LAN, or
# over Tailscale from outside.
[live.quality.720p]
order       = 2
label       = "720p"
bandwidth   = 3000000
output_args = ["-vf", "deinterlace_vaapi,scale_vaapi=w=1280:h=720,setsar=1",
               "-c:v", "h264_vaapi",
               "-b:v", "2.5M", "-maxrate", "3M", "-bufsize", "6M",
               "-c:a", "aac", "-b:a", "128k"]

# This box: Intel N100 iGPU. Measured 4.9x realtime at 68% of one core, where
# software is 2.2x at 309% — the CPU headroom is what matters, since live HLS
# has to keep encoding while this runs.
[transcode]
enable = true
input_args  = ["-hwaccel", "vaapi",
               "-hwaccel_device", "/dev/dri/renderD128",
               "-hwaccel_output_format", "vaapi"]
# The scale is written the same way the software path writes it, and for the
# same reason: ISDB-T codes HD as 1440x1080 with non-square pixels (SAR 4:3),
# and browsers do not reliably honour the SAR in the H.264 VUI. `w=1920:h=1080`
# gets the HD case right only by coincidence — that *is* 1440 × 4/3 — and gets a
# 4:3 SD subchannel wrong, stretching 720x480 into a 16:9 frame. Scaling the
# width by the source's own SAR is the general form; scale_vaapi takes the
# expression (checked against ffmpeg 6.1 here, on this box's iGPU, from a real
# 1440x1080 recording: out 1920x1080 SAR 1:1).
output_args = ["-vf", "deinterlace_vaapi,scale_vaapi=w=trunc(iw*sar/2)*2:h=ih,setsar=1",
               "-c:v", "h264_vaapi", "-b:v", "6M",
               "-c:a", "aac", "-b:a", "192k"]
