http_port = 8010
storage_root = "/var/lib/isdbd"
adapters = [0]

# dvbr is built into the parent virtual workspace's target/, not dvbr/target/.
dvbr_bin     = "/home/duckfeather/code/isdb-workspace/target/release/dvb-rs"
b25_bin      = "/home/duckfeather/code/isdb-workspace/libaribb25-rs/target/release/b25-rs"
ffmpeg_bin   = "ffmpeg"
ffprobe_bin  = "ffprobe"

channels_file = "channels.json"

# Live A/V sync: probe first audio+video PTS and delay audio by their
# difference (ISDB skew). Auto-enabled when ffprobe_bin is set.
#   probe_seconds     = 5   # sampling window; set < 0 to disable
#   audio_offset_bias = 0   # extra seconds added to the measured offset

# EPG refresh cron (UTC). Default: every 6 hours.
epg_cron = "0 */6 * * *"
epg_channels = ["TOKYO MX1", "NHKEFl1El5~", "asahi"]
